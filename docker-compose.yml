services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: AutoPartsHub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - autoparts-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d AutoPartsHub"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=AutoPartsHub;Username=postgres;Password=postgres
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__EnablePolling: ${TELEGRAM_ENABLE_POLLING:-true}
      Telegram__EnableConsole: "false"
      Telegram__AdminChatIds__0: ${TELEGRAM_ADMIN_CHAT_ID:-0}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  autoparts-postgres:
