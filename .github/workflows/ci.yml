name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore AutoPartsHub.sln --disable-parallel -m:1
      - run: dotnet build AutoPartsHub.sln --configuration Release --no-restore -m:1
      - run: dotnet test tests/AutoPartsHub.Tests/AutoPartsHub.Tests.csproj --configuration Release --no-build -m:1 --collect:"XPlat Code Coverage"
